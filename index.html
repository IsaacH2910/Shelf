<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shelf.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Shelf" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Shelf</title>
    <script>
      if (location.protocol === "http:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        location.replace("https://" + location.host + location.pathname + location.search + location.hash);
      }
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #0b0b0c;
        color: #f3efe6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #root {
        position: fixed;
        inset: 0;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0c;
        color: #c4a574;
        font-size: 15px;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">Starting Shelf...</div>
    <script>
      window.addEventListener("error", function (event) {
        var boot = document.getElementById("boot");
        if (boot) boot.textContent = "Error: " + (event.message || "failed to load");
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
